<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de IMC</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        main {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 320px;
        }
        h1 {
            text-align: center;
            color: #333;
            font-size: 22px;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #resultado {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            color: #333;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <main>
        <h1>Calculadora de IMC</h1>
        <div class="input-group">
            <label>Nome:</label>
            <input type="text" id="nome">
        </div>
        <div class="input-group">
            <label>Altura (ex: 1.75):</label>
            <input type="number" id="altura" step="0.01">
        </div>
        <div class="input-group">
            <label>Peso (ex: 70):</label>
            <input type="number" id="peso" step="0.1">
        </div>
        <button id="calcular">Calcular</button>
        <div id="resultado"></div>
    </main>
    <script src="./imc.js"></script>
</body>
</html>
